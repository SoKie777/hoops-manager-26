name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Tester le moteur (3 saisons simulées)
        run: npm test

      - name: Préparer les fichiers web
        run: npm run build

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Générer l'icône et l'écran de démarrage
        run: >
          npx -y @capacitor/assets@3.0.5 generate --android
          --iconBackgroundColor '#07090d' --iconBackgroundColorDark '#07090d'
          --splashBackgroundColor '#07090d' --splashBackgroundColorDark '#07090d'

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hoops-manager-26.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hoops-manager-26-apk
          path: hoops-manager-26.apk

      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hoops Manager 26 · build ${{ github.run_number }}
          body: APK de debug généré automatiquement depuis ${{ github.sha }}. À installer sur Android (autoriser les sources inconnues).
          files: hoops-manager-26.apk
