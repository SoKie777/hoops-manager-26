name: Build APK

on:
  push:
    branches: [main, codex/coach-social-manager-2026-11-13]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la boucle Manager et simuler 3 saisons
        run: npm test

      - name: Banc d'essai statistique
        run: node test/engine.test.js 1500 fast

      - name: Préparer les fichiers web
        run: npm run build

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Orientation paysage
        run: |
          sed -i -E 's/<activity( |$)/<activity android:screenOrientation="sensorLandscape"\\1/' android/app/src/main/AndroidManifest.xml
          grep -o 'android:screenOrientation="[a-zA-Z]*"' android/app/src/main/AndroidManifest.xml

      - name: Générer l'icône et l'écran de démarrage
        run: |
          npx -y @capacitor/assets@3.0.5 generate --android \\
            --iconBackgroundColor '#07090d' --iconBackgroundColorDark '#07090d' \\
            --splashBackgroundColor '#07090d' --splashBackgroundColorDark '#07090d'

      - name: Numéro de version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Utilise la clé permanente du dépôt si elle existe. Sinon, clé temporaire
      # pour fournir un APK installable de test via l'artefact Actions.
      - name: Signer l'APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/hoops-release.p12"
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            KEY_TYPE="PKCS12"
            KEY_PASS="$ANDROID_KEYSTORE_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 \\
              -alias hoops -keyalg RSA -keysize 2048 -validity 10000 \\
              -storepass temporary-build-key -keypass temporary-build-key \\
              -dname "CN=Hoops Manager 26, OU=Build, O=SoKie777, L=Abidjan, C=CI"
            KEY_TYPE="PKCS12"
            KEY_PASS="temporary-build-key"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-type "$KEY_TYPE" --ks-pass "pass:$KEY_PASS" \\
            --ks-key-alias hoops --key-pass "pass:$KEY_PASS" --out hoops-manager-26.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose hoops-manager-26.apk
          rm -f "$KEYSTORE" "$RUNNER_TEMP/aligned.apk"

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: hoops-manager-26-apk
          path: hoops-manager-26.apk
          if-no-files-found: error
          retention-days: 30

      # Les releases sont réservées aux builds main pour éviter les tags
      # et releases multiples à chaque push de branche ou PR.
      - name: Publier une release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hoops Manager 26 · build ${{ github.run_number }}
          body: APK signé, généré depuis ${{ github.sha }}.
          files: hoops-manager-26.apk
