name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Tester le moteur (3 saisons simulées)
        run: npm test

      - name: Banc d'essai statistique (milliers de matchs, cibles NBA, exploits tactiques)
        run: node test/engine.test.js 1500

      - name: Préparer les fichiers web
        run: npm run build

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      # Écran verrouillé en paysage (les deux sens, selon le capteur).
      - name: Orientation paysage
        run: |
          sed -i -E 's/<activity( |$)/<activity android:screenOrientation="sensorLandscape"\1/' android/app/src/main/AndroidManifest.xml
          grep -o 'android:screenOrientation="[a-zA-Z]*"' android/app/src/main/AndroidManifest.xml

      - name: Générer l'icône et l'écran de démarrage
        run: >
          npx -y @capacitor/assets@3.0.5 generate --android
          --iconBackgroundColor '#07090d' --iconBackgroundColorDark '#07090d'
          --splashBackgroundColor '#07090d' --splashBackgroundColorDark '#07090d'

      # Numéro de version croissant : chaque build s'installe par-dessus le précédent.
      - name: Numéro de version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Signature avec une clé fixe (secrets du dépôt) : même signature à chaque build, donc mise à jour sans désinstaller.
      - name: Signer l'APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias hoops --out hoops-manager-26.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs hoops-manager-26.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: hoops-manager-26-apk
          path: hoops-manager-26.apk

      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hoops Manager 26 · build ${{ github.run_number }}
          body: APK signé (version 1.${{ github.run_number }}), généré depuis ${{ github.sha }}. S'installe par-dessus la version précédente en gardant la sauvegarde.
          files: hoops-manager-26.apk
